<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#064e3b" />
      <stop offset="0.5" stop-color="#047857" />
      <stop offset="1" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="gold" x1="160" y1="120" x2="350" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fde047" />
      <stop offset="0.4" stop-color="#eab308" />
      <stop offset="1" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="512" height="512" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  
  <!-- Subtle Inner Ring -->
  <circle cx="256" cy="256" r="210" stroke="#10b981" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="12 12" />
  
  <!-- Central Shield / Fist Emblem -->
  <g filter="url(#shadow)">
    <!-- Golden Coin -->
    <circle cx="256" cy="200" r="90" fill="url(#gold)" />
    <circle cx="256" cy="200" r="76" stroke="#fef08a" stroke-width="3" stroke-opacity="0.8" />
    
    <!-- Arabic Qaf 'ق' on the Coin -->
    <text x="256" y="222" font-family="'Cairo', sans-serif" font-size="88" font-weight="900" fill="#78350f" text-anchor="middle">ق</text>
    
    <!-- Stylized Hand Palm Supporting Wealth -->
    <path d="M140 310 C 140 270, 180 250, 220 270 L 256 290 L 292 270 C 332 250, 372 270, 372 310 C 372 380, 320 420, 256 420 C 192 420, 140 380, 140 310 Z" fill="#ecfdf5" />
    
    <!-- Hand Palm details -->
    <path d="M220 320 C 240 335, 272 335, 292 320" stroke="#047857" stroke-width="6" stroke-linecap="round" />
    <path d="M235 350 C 245 360, 267 360, 277 350" stroke="#047857" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
