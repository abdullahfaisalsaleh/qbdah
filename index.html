<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <script>
      (function() {
        // Prevent unhandled rejections or error alerts from Vite dev HMR websocket
        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            ((event.reason.message && event.reason.message.includes('WebSocket')) ||
             (typeof event.reason === 'string' && event.reason.includes('WebSocket')) ||
             (event.reason.stack && event.reason.stack.includes('createWebSocketModuleRunnerTransport')))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (event.message && event.message.includes('websocket')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        // Intercept Vite HMR WebSocket connection to avoid connection errors in Cloud Run
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          window.WebSocket = function(url, protocols) {
            var isHmr = false;
            if (
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && (url.includes('token=') || url.includes('24678') || url.includes('/@vite/client')))
            ) {
              isHmr = true;
            }
            if (isHmr) {
              var target = new EventTarget();
              target.binaryType = 'blob';
              target.bufferedAmount = 0;
              target.extensions = '';
              target.protocol = 'vite-hmr';
              target.readyState = 1; // OPEN
              target.url = url;
              target.send = function() {};
              target.close = function() { target.readyState = 3; };
              setTimeout(function() {
                var openEvt = new Event('open');
                if (typeof target.onopen === 'function') target.onopen(openEvt);
                target.dispatchEvent(openEvt);
              }, 0);
              return target;
            }
            return new NativeWebSocket(url, protocols);
          };
          window.WebSocket.prototype = NativeWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }
      })();
    </script>
